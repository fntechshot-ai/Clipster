name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build Clipster.app (no Xcode)
        run: ./build_noxcode.sh

      - name: Package DMG
        run: ./make_dmg.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipster-dmg
          path: dist/Clipster.dmg

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clipster.dmg
